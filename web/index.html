<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StS II Archipelago</title>
    <!--
      GoatCounter visitor counts for the beta site (no cookies, no personal data).
      Routes live in the URL hash (#/builder), which GoatCounter ignores by default,
      so report the hash as part of the path. Later route changes are counted in
      router.ts. count.js skips localhost, so dev servers are not counted.
    -->
    <script>
      // Loading the site with #toggle-goatcounter turns counting off or on for this
      // browser. count.js has the same toggle, but it loads asynchronously and the
      // router may have rewritten the hash to #/toggle-goatcounter by then, so the
      // toggle is done here, before the router starts. Clearing the hash stops
      // count.js from toggling it back.
      if (location.hash === "#toggle-goatcounter" || location.hash === "#/toggle-goatcounter") {
        try {
          if (localStorage.getItem("skipgc") === "t") {
            localStorage.removeItem("skipgc");
            alert("GoatCounter now counts your visits in this browser.");
          } else {
            localStorage.setItem("skipgc", "t");
            alert("GoatCounter no longer counts your visits in this browser. Load this address again to undo.");
          }
        } catch (e) {
          // Storage is blocked (private mode or site data disabled); nothing to toggle.
        }
        history.replaceState(null, "", location.pathname + location.search + "#/");
      }

      window.goatcounter = {
        path: function () {
          return location.pathname + location.hash.split("?")[0];
        },
      };
    </script>
    <script
      data-goatcounter="https://sts2ap.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
